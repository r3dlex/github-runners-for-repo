name: archgate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  _archgate-self-hosted:
    name: "archgate (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      # archgate v0.43+ ships a bundled TypeScript runtime (bun + node),
      # so no `actions/setup-node@v4` step is needed.
      # archgate-runtime: bundled
      #
      # Linux/ARM64 has no upstream archgate release binary. The
      # self-hosted runner host provisioning script builds the native
      # binary from source and installs it to $HOME/.archgate/bin/archgate,
      # which is on the runner's PATH (see the runner's .path file).
      # For other platforms the official setup-action downloads the
      # platform binary into the same location.
      - name: Setup archgate
        if: runner.os != 'Linux' || runner.arch == 'X64'
        uses: archgate/setup-action@v1
      - name: archgate check
        # archgate-runtime: bundled
        run: archgate check
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  archgate:
    name: "archgate"
    needs: _archgate-self-hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._archgate-self-hosted.outputs.passed }}"

      - if: needs._archgate-self-hosted.outputs.passed != 'true'
        uses: actions/checkout@v4

      - name: Setup archgate
        if: needs._archgate-self-hosted.outputs.passed != 'true'
        # archgate-runtime: bundled
        uses: archgate/setup-action@v1

      - name: archgate check
        if: needs._archgate-self-hosted.outputs.passed != 'true'
        # archgate-runtime: bundled
        run: archgate check
