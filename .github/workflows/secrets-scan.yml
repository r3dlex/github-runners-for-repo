name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  _secrets-scan-self-hosted:
    name: "secrets-scan (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          case "$(uname -s)_$(uname -m)" in
            Linux_x86_64) asset="gitleaks_${version}_linux_x64.tar.gz" ;;
            Linux_aarch64|Linux_arm64) asset="gitleaks_${version}_linux_arm64.tar.gz" ;;
            Darwin_x86_64) asset="gitleaks_${version}_darwin_x64.tar.gz" ;;
            Darwin_arm64) asset="gitleaks_${version}_darwin_arm64.tar.gz" ;;
            *) echo "unsupported gitleaks platform: $(uname -s)_$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  secrets-scan:
    name: "secrets-scan"
    needs: _secrets-scan-self-hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._secrets-scan-self-hosted.outputs.passed }}"

      - if: needs._secrets-scan-self-hosted.outputs.passed != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        if: needs._secrets-scan-self-hosted.outputs.passed != 'true'
        run: |
          set -euo pipefail
          version="8.30.1"
          case "$(uname -s)_$(uname -m)" in
            Linux_x86_64) asset="gitleaks_${version}_linux_x64.tar.gz" ;;
            Linux_aarch64|Linux_arm64) asset="gitleaks_${version}_linux_arm64.tar.gz" ;;
            Darwin_x86_64) asset="gitleaks_${version}_darwin_x64.tar.gz" ;;
            Darwin_arm64) asset="gitleaks_${version}_darwin_arm64.tar.gz" ;;
            *) echo "unsupported gitleaks platform: $(uname -s)_$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
