name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  _coverage-self-hosted:
    name: "Coverage (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - run: rm -rf .coverage coverage.xml || true

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The interpreter is pinned on purpose. Left unpinned, `uv` picks the
      # NEWEST CPython on the runner, and pip-api 0.0.34 (via pip-audit
      # 2.10.1) vendors a pyparsing 2.x that imports `sre_constants` —
      # removed in Python 3.15 — so the audit dies with ModuleNotFoundError.
      # 3.12 is also exactly the interpreter the hosted leg runs, so the two
      # legs stay true substitutes for each other.
      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Coverage
        run: uv run pytest --cov=github_runners_for_repo --cov-report=xml --cov-fail-under=95

      - name: Coverage threshold drift guard (AC-22)
        run: uv run python tools/check_cov_threshold_drift.py

      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  coverage:
    name: "coverage"
    needs: _coverage-self-hosted
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._coverage-self-hosted.outputs.passed }}"

      - if: needs._coverage-self-hosted.outputs.passed != 'true'
        uses: actions/checkout@v4

      - name: Install uv
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The interpreter is pinned on purpose. Left unpinned, `uv` picks the
      # NEWEST CPython on the runner, and pip-api 0.0.34 (via pip-audit
      # 2.10.1) vendors a pyparsing 2.x that imports `sre_constants` —
      # removed in Python 3.15 — so the audit dies with ModuleNotFoundError.
      # 3.12 is also exactly the interpreter the hosted leg runs, so the two
      # legs stay true substitutes for each other.
      - name: Install Python 3.12
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        run: uv sync --frozen --python 3.12

      - name: Coverage
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        run: uv run pytest --cov=github_runners_for_repo --cov-report=xml --cov-fail-under=95

      - name: Coverage threshold drift guard (AC-22)
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        run: uv run python tools/check_cov_threshold_drift.py
