# THROWAWAY PROBE — delete this file and its branch once the artifact has
# been collected.
#
# Upstream archgate/cli publishes NO linux-arm64 release asset (only
# darwin-arm64, darwin-x64, linux-x64, win32-x64), so the org's linux/arm64
# runners build the native binary from source (see the `ensure_archgate`
# function in github_runners_for_repo/scripts/provision-host.sh).
#
# This probe builds the PINNED upstream release commit on a real linux/arm64
# runner, runs archgate's OWN test suite there, packages the binary with the
# upstream release asset naming (archgate-linux-arm64.tar.gz holding a single
# `archgate` binary) and publishes the sha256 so it can be registered.
#
# It publishes NOTHING to any release. Producing the bytes is this job's
# only job; registering them is a human decision.
name: probe-archgate-arm64

on:
  push:
    branches: [probe/archgate-arm64-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-archgate-arm64
  cancel-in-progress: false

jobs:
  build:
    name: "build archgate linux/arm64"
    # r3dlex-linux-arm64-1..4 — the linux/arm64 fleet. The label set is
    # pure AND, so the extra `r3dlex-linux-arm64` label keeps the macOS
    # runners and the dpua runners out of the pool.
    runs-on: [self-hosted, Linux, ARM64, r3dlex-linux-arm64]
    timeout-minutes: 120
    env:
      # The upstream v0.61.0 tag resolves to exactly this commit
      # ("chore(release): 0.61.0 (#655)").
      ARCHGATE_REF: f65d99f56d02757cca94d53f6d717333770e0170
      ASSET_NAME: archgate-linux-arm64
    steps:
      - name: Checkout archgate/cli at the pinned release commit
        uses: actions/checkout@v4
        with:
          repository: archgate/cli
          ref: f65d99f56d02757cca94d53f6d717333770e0170
          fetch-depth: 1
          persist-credentials: false
          # Checked out into a subdirectory: archgate's own GEN-005 rule
          # requires the repository root to contain only allowlisted files,
          # so the job's scratch files (the bun cache, the test logs, the
          # build output) must live OUTSIDE the checked out repo.
          path: archgate-src

      - name: Record the checked out commit
        working-directory: archgate-src
        run: |
          set -euo pipefail
          echo "archgate HEAD = $(git rev-parse HEAD)"
          echo "archgate describe = $(git describe --tags --always 2>/dev/null || echo unknown)"
          echo "uname = $(uname -s) $(uname -m)"
          if [ "$(git rev-parse HEAD)" != "$ARCHGATE_REF" ]; then
            echo "::error::checked out commit does not match the pinned ref"
            exit 1
          fi

      - name: Probe the runner tooling and capacity
        # This runner image is minimal: no unzip, no python3, no bsdtar and
        # no bun. The bun.sh installer needs unzip, so it cannot be used.
        # Print the inventory so the install step below can pick a route
        # that actually exists here, and record the machine's capacity so
        # a wall-clock budget result can be read in context.
        run: |
          set -uo pipefail
          echo "HOME=$HOME"
          echo "uname=$(uname -s) $(uname -m)"
          for tool in tar gzip xz zstd unzip python python3 node npm perl busybox curl wget sha512sum sha256sum nproc; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" 2>/dev/null || echo MISSING)"
          done
          echo "nproc=$(nproc 2>/dev/null || echo unknown)"
          echo "loadavg=$(cat /proc/loadavg 2>/dev/null || echo unknown)"
          echo "cpu-model=$(grep -m1 'model name' /proc/cpuinfo 2>/dev/null || echo unknown)"
          echo "cpu-flags=$(grep -m1 '^flags' /proc/cpuinfo 2>/dev/null | tr ' ' '\n' | grep -cE '^(hypervisor|asimd|fp|neon)' 2>/dev/null || echo unknown)"
          echo "hypervisor=$(grep -m1 -o hypervisor /proc/cpuinfo 2>/dev/null || echo none)"
          free -m 2>/dev/null || true
          echo "--- /usr/bin ---"
          # shellcheck disable=SC2012
          ls /usr/bin 2>/dev/null | tr '\n' ' ' | head -c 2000
          echo
          echo "--- /usr/local/bin ---"
          # shellcheck disable=SC2012
          ls /usr/local/bin 2>/dev/null | tr '\n' ' ' | head -c 1000
          echo

      - name: Install bun (job scoped)
        # The fleet shares one $HOME between runner instances, so bun is
        # installed into a job scoped directory inside the workspace
        # instead of the shared $HOME/.bun. Nothing outside this job's
        # workspace is touched.
        #
        # Route: the npm platform package @oven/bun-<platform> ships the RAW
        # bun binary in a plain .tgz, so `tar -xzf` unpacks it without
        # unzip. The tarball is checksum-locked against the sha512 the npm
        # registry publishes for that exact version.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
          BUN_VERSION: 1.4.4
        run: |
          set -uo pipefail
          mkdir -p "$BUN_INSTALL/bin"
          bun_bin=""

          # (a) a bun that is already on this runner
          for candidate in "$(command -v bun 2>/dev/null || true)" "$HOME/.bun/bin/bun"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              bun_bin="$candidate"
              printf 'using the bun already present at %s\n' "$candidate"
              break
            fi
          done

          # (b) the checksum-locked npm platform package
          if [ -z "$bun_bin" ]; then
            case "$(uname -m)" in
              aarch64)
                pkg="linux-aarch64"
                sha="65356da5ff7398748154f5f5b01c1ee5a8066ffacddf8c8f1a0fc76f2f1ed80c76b82500d944592a5647eea2e7b4aeea68524231787dbf4196358376cc8373d7"
                ;;
              x86_64)
                pkg="linux-x64"
                sha="0876db9261d5336f13d4616afba18be00a38ba3c306308f50b1145c041732da9cf7cdb0877d0216c83f4438ade5ae5819068a6524a10ca0acaed1823b63defa2"
                ;;
              *)
                echo "::error::unsupported arch $(uname -m)"
                exit 1
                ;;
            esac
            tgz="$BUN_INSTALL/bun.tgz"
            url="https://registry.npmjs.org/@oven/bun-${pkg}/-/bun-${pkg}-${BUN_VERSION}.tgz"
            if curl -fsSL --retry 3 --max-time 300 "$url" -o "$tgz"; then
              printf 'downloaded %s bytes of bun %s (%s)\n' "$(wc -c < "$tgz")" "$BUN_VERSION" "$pkg"
              actual=""
              if command -v sha512sum >/dev/null 2>&1; then
                actual="$(sha512sum "$tgz" | awk '{print $1}')"
              elif command -v shasum >/dev/null 2>&1; then
                actual="$(shasum -a 512 "$tgz" | awk '{print $1}')"
              fi
              if [ -n "$actual" ] && [ "$actual" != "$sha" ]; then
                echo "::error::bun tarball checksum mismatch: $actual"
                rm -f "$tgz"
                exit 1
              fi
              if [ -z "$actual" ]; then
                echo "::warning::no sha512 tool on this runner, checksum not verified"
              else
                printf 'bun tarball sha512 verified: %s\n' "$actual"
              fi
              mkdir -p "$BUN_INSTALL/dl"
              if tar -xzf "$tgz" -C "$BUN_INSTALL/dl" && [ -f "$BUN_INSTALL/dl/package/bin/bun" ]; then
                cp -f "$BUN_INSTALL/dl/package/bin/bun" "$BUN_INSTALL/bin/bun"
                chmod +x "$BUN_INSTALL/bin/bun"
                bun_bin="$BUN_INSTALL/bin/bun"
              else
                echo "::warning::could not unpack $tgz with tar"
              fi
              rm -f "$tgz"
            else
              echo "::warning::bun npm tarball download failed"
            fi
          fi

          if [ -z "$bun_bin" ]; then
            echo "::error::no bun available on this runner"
            exit 1
          fi
          case ":$PATH:" in
            *":$(dirname "$bun_bin"):"*) ;;
            *) printf '%s\n' "$(dirname "$bun_bin")" >> "$GITHUB_PATH" ;;
          esac
          "$bun_bin" --version
          printf 'bun resolved at %s\n' "$bun_bin"

      - name: bun install --frozen-lockfile
        working-directory: archgate-src
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: bun install --frozen-lockfile

      - name: CPU benchmark
        working-directory: archgate-src
        # A comparable integer throughput number, so the arm64 and x64
        # measurements of the same wall-clock budgets can be read against
        # each other.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -uo pipefail
          bun -e 'const t=Date.now(); let s=0; for(let i=0;i<5e7;i++){s=(s+i)%1000000007;} console.log("bench_iterations=5e7 bench_ms="+(Date.now()-t)+" checksum="+s);'

      - name: archgate latency-budget tests on arm64, measured without the 190-file parallel load
        working-directory: archgate-src
        # These two files assert WALL-CLOCK budgets (startup latency, per
        # rule time budget). Upstream's own source documents that the
        # budgets are load sensitive: "under `bun run test`'s parallel load
        # one `check` sample reaches ~3.5x" of the idle baseline. Running
        # them on their own is the only way the measurement means anything.
        # No test is skipped and no assertion is loosened — the same files
        # run, with the same thresholds, just without 188 other test files
        # competing for the CPU. This step reports; the x64 control job
        # decides whether a miss here is arm64 or the fleet.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set +e
          set -o pipefail
          bun test --timeout 60000 \
            tests/integration/cli-perf.test.ts \
            tests/engine/runner-pressure.test.ts \
            2>&1 | tee "$GITHUB_WORKSPACE/test-latency-budgets.txt"
          rc=${PIPESTATUS[0]}
          set -e
          printf 'isolated latency-budget suite exit code = %s\n' "$rc"
          echo "----- summary -----"
          grep -E "^[[:space:]]*[0-9]+ (pass|fail|skip|todo)|^Ran [0-9]+ tests" "$GITHUB_WORKSPACE/test-latency-budgets.txt" || true
          echo "----- measured budgets -----"
          grep -E "took [0-9]+ms \(median" "$GITHUB_WORKSPACE/test-latency-budgets.txt" || true
          echo "----- failing assertions -----"
          grep -E "\(fail\)" "$GITHUB_WORKSPACE/test-latency-budgets.txt" || true
          echo "----- end -----"
          exit 0

      - name: archgate's own test suite on arm64 (upstream's package.json script)
        working-directory: archgate-src
        # package.json: "test": "bun test --timeout 60000 --parallel"
        # This is the canonical invocation and its result is reported
        # verbatim. `--parallel` runs 190 test files at once, which starves
        # the wall-clock budget assertions.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set +e
          set -o pipefail
          bun run test 2>&1 | tee "$GITHUB_WORKSPACE/test-parallel.txt"
          rc=${PIPESTATUS[0]}
          set -e
          printf 'canonical parallel suite exit code = %s\n' "$rc"
          echo "----- archgate test summary, upstream script, 190-file parallel load -----"
          grep -E "^[[:space:]]*[0-9]+ (pass|fail|skip|todo)|^Ran [0-9]+ tests" "$GITHUB_WORKSPACE/test-parallel.txt" || true
          echo "----- the failing assertions -----"
          grep -E "\(fail\)" "$GITHUB_WORKSPACE/test-parallel.txt" || true
          echo "----- end -----"
          exit 0

      - name: Build the linux/arm64 binary
        working-directory: archgate-src
        # The compile flags mirror the `ensure_archgate` recipe in
        # github_runners_for_repo/scripts/provision-host.sh — the recipe the
        # org's own arm64 CI already runs `archgate check` with. The
        # --compile-exec-argv flag matches upstream's release-binaries.yml
        # so this asset trusts the same CA store as the darwin-arm64 and
        # linux-x64 assets superman's CI already consumes. --target is
        # omitted because the host IS bun-linux-arm64, so the default target
        # is already correct.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          bun build src/cli.ts --compile --bytecode \
            --compile-exec-argv=--use-system-ca \
            --outfile "$GITHUB_WORKSPACE/out/archgate"
          chmod +x out/archgate
          ls -l "$GITHUB_WORKSPACE/out/archgate"
          file "$GITHUB_WORKSPACE/out/archgate" || true

      - name: Prove the binary runs on arm64
        working-directory: archgate-src
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -euo pipefail
          echo "----- archgate --version -----"
          "$GITHUB_WORKSPACE"/out/archgate --version
          echo "----- archgate --help (head) -----"
          "$GITHUB_WORKSPACE"/out/archgate --help 2>&1 | head -30
          version="$("$GITHUB_WORKSPACE"/out/archgate --version 2>&1 | tr -d '[:space:]')"
          printf 'parsed version = %s\n' "$version"
          case "$version" in
            *0.61.0*) echo "version 0.61.0 confirmed" ;;
            *) echo "::error::expected version 0.61.0, got '$version'"; exit 1 ;;
          esac

      - name: Measure the COMPILED binary's startup latency
        working-directory: archgate-src
        # The upstream budget tests measure `bun run src/cli.ts`, i.e. the
        # CLI running FROM SOURCE with a transpile on every spawn. The
        # asset that superman's CI actually consumes is the COMPILED
        # binary, so measure that too, against the same budgets.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -uo pipefail
          for label in "--version" "--help"; do
            for i in 1 2 3; do
              start=$(date +%s%N)
              "$GITHUB_WORKSPACE"/out/archgate $label >/dev/null 2>&1
              end=$(date +%s%N)
              printf 'compiled %s run %s: %sms\n' "$label" "$i" "$(( (end - start) / 1000000 ))"
            done
          done
          exit 0

      - name: Functional smoke test (archgate check on its own repo)
        working-directory: archgate-src
        # A vacuous pass is possible (archgate skips ADRs whose scope misses
        # the changed file set), so this is reported, not enforced. It still
        # proves the compiled engine loads and runs on arm64.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set +e
          set -uo pipefail
          "$GITHUB_WORKSPACE"/out/archgate check 2>&1 | tee "$GITHUB_WORKSPACE/check-output.txt" | tail -40
          printf 'archgate check exit code = %s\n' "${PIPESTATUS[0]:-$?}"
          exit 0

      - name: Package the release asset and compute the checksums
        # Upstream shape: a tarball holding a single `archgate` binary at the
        # archive root, plus a <asset>.sha256 file in `sha256sum` format.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/out"
          tar -czf "$ASSET_NAME.tar.gz" archgate
          sha256sum "$ASSET_NAME.tar.gz" > "$ASSET_NAME.tar.gz.sha256"
          sha256sum archgate > archgate.binary.sha256
          echo "----- sha256sum of the tarball -----"
          cat "$ASSET_NAME.tar.gz.sha256"
          echo "----- sha256sum of the bare binary -----"
          cat archgate.binary.sha256
          echo "----- tarball contents -----"
          tar -tzf "$ASSET_NAME.tar.gz"
          echo "----- sizes -----"
          ls -l "$ASSET_NAME.tar.gz" archgate

      - name: Publish the summary
        run: |
          set -euo pipefail
          tarball_sha="$(awk '{print $1}' "out/$ASSET_NAME.tar.gz.sha256")"
          binary_sha="$(awk '{print $1}' out/archgate.binary.sha256)"
          {
            echo "## archgate linux/arm64 build"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| archgate commit | \`$ARCHGATE_REF\` |"
            echo "| archgate version | \`0.61.0\` |"
            echo "| runner | \`${{ github.run_id }}\` / \`${{ github.job }}\` |"
            echo "| runner name | \`${{ runner.name }}\` |"
            echo "| runner arch | \`${{ runner.os }}\` / \`${{ runner.arch }}\` |"
            echo "| tarball | \`$ASSET_NAME.tar.gz\` |"
            echo "| tarball sha256 | \`$tarball_sha\` |"
            echo "| binary sha256 | \`$binary_sha\` |"
            echo ""
            echo "### archgate test suite on arm64, upstream script (190-file parallel load)"
            echo ""
            echo '```'
            grep -E "^[[:space:]]*[0-9]+ (pass|fail|skip|todo)|^Ran [0-9]+ tests" test-parallel.txt || echo "(no summary line captured)"
            echo '```'
            echo ""
            echo "### archgate latency-budget files on arm64, measured alone"
            echo ""
            echo '```'
            grep -E "^[[:space:]]*[0-9]+ (pass|fail|skip|todo)|^Ran [0-9]+ tests" test-latency-budgets.txt || echo "(no summary line captured)"
            echo '```'
            echo ""
            echo "### archgate --version"
            echo ""
            echo '```'
            "$GITHUB_WORKSPACE"/out/archgate --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: archgate-linux-arm64-0.61.0
          # `out/` is not a dot directory, so no include-hidden-files needed.
          path: |
            out/archgate-linux-arm64.tar.gz
            out/archgate-linux-arm64.tar.gz.sha256
            out/archgate.binary.sha256
          if-no-files-found: error
          retention-days: 30

      - name: archgate's own test suite on arm64, full run without the parallel load
        working-directory: archgate-src
        # The same test files and the same assertions as `bun run test`,
        # scheduled without `--parallel` so the wall-clock budget assertions
        # are not starved by 189 other test files. Runs last, after the
        # artifact is uploaded, so the bytes are secured either way.
        timeout-minutes: 60
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set +e
          set -o pipefail
          bun test --timeout 60000 2>&1 | tee "$GITHUB_WORKSPACE/test-serial.txt"
          rc=${PIPESTATUS[0]}
          set -e
          printf 'serial suite exit code = %s\n' "$rc"
          echo "----- summary -----"
          grep -E "^[[:space:]]*[0-9]+ (pass|fail|skip|todo)|^Ran [0-9]+ tests" "$GITHUB_WORKSPACE/test-serial.txt" || true
          echo "----- failing assertions -----"
          grep -E "\(fail\)" "$GITHUB_WORKSPACE/test-serial.txt" || true
          echo "----- end -----"
          exit 0

  control-x64:
    name: "control: same latency budgets on linux/x64"
    # The control for the arm64 result: the SAME two upstream budget files,
    # on the SAME fleet, on the x64 runners. If they miss the budget here
    # too, the budget misses are a property of the fleet's execution
    # environment, not of arm64.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout archgate/cli at the pinned release commit
        uses: actions/checkout@v4
        with:
          repository: archgate/cli
          ref: f65d99f56d02757cca94d53f6d717333770e0170
          fetch-depth: 1
          persist-credentials: false
          # Checked out into a subdirectory: archgate's own GEN-005 rule
          # requires the repository root to contain only allowlisted files,
          # so the job's scratch files (the bun cache, the test logs, the
          # build output) must live OUTSIDE the checked out repo.
          path: archgate-src

      - name: Record the runner capacity
        working-directory: archgate-src
        run: |
          set -uo pipefail
          echo "uname=$(uname -s) $(uname -m)"
          echo "nproc=$(nproc 2>/dev/null || echo unknown)"
          echo "loadavg=$(cat /proc/loadavg 2>/dev/null || echo unknown)"
          echo "cpu-model=$(grep -m1 'model name' /proc/cpuinfo 2>/dev/null || echo unknown)"
          echo "hypervisor=$(grep -m1 -o hypervisor /proc/cpuinfo 2>/dev/null || echo none)"
          for tool in tar curl sha512sum; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" 2>/dev/null || echo MISSING)"
          done

      - name: Install bun (job scoped)
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
          BUN_VERSION: 1.4.4
        run: |
          set -uo pipefail
          mkdir -p "$BUN_INSTALL/bin"
          bun_bin=""
          for candidate in "$(command -v bun 2>/dev/null || true)" "$HOME/.bun/bin/bun"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              bun_bin="$candidate"
              printf 'using the bun already present at %s\n' "$candidate"
              break
            fi
          done
          if [ -z "$bun_bin" ]; then
            case "$(uname -m)" in
              aarch64)
                pkg="linux-aarch64"
                sha="65356da5ff7398748154f5f5b01c1ee5a8066ffacddf8c8f1a0fc76f2f1ed80c76b82500d944592a5647eea2e7b4aeea68524231787dbf4196358376cc8373d7"
                ;;
              x86_64)
                pkg="linux-x64"
                sha="0876db9261d5336f13d4616afba18be00a38ba3c306308f50b1145c041732da9cf7cdb0877d0216c83f4438ade5ae5819068a6524a10ca0acaed1823b63defa2"
                ;;
              *)
                echo "::error::unsupported arch $(uname -m)"
                exit 1
                ;;
            esac
            tgz="$BUN_INSTALL/bun.tgz"
            url="https://registry.npmjs.org/@oven/bun-${pkg}/-/bun-${pkg}-${BUN_VERSION}.tgz"
            if curl -fsSL --retry 3 --max-time 300 "$url" -o "$tgz"; then
              printf 'downloaded %s bytes of bun %s (%s)\n' "$(wc -c < "$tgz")" "$BUN_VERSION" "$pkg"
              actual=""
              if command -v sha512sum >/dev/null 2>&1; then
                actual="$(sha512sum "$tgz" | awk '{print $1}')"
              elif command -v shasum >/dev/null 2>&1; then
                actual="$(shasum -a 512 "$tgz" | awk '{print $1}')"
              fi
              if [ -n "$actual" ] && [ "$actual" != "$sha" ]; then
                echo "::error::bun tarball checksum mismatch: $actual"
                rm -f "$tgz"
                exit 1
              fi
              mkdir -p "$BUN_INSTALL/dl"
              if tar -xzf "$tgz" -C "$BUN_INSTALL/dl" && [ -f "$BUN_INSTALL/dl/package/bin/bun" ]; then
                cp -f "$BUN_INSTALL/dl/package/bin/bun" "$BUN_INSTALL/bin/bun"
                chmod +x "$BUN_INSTALL/bin/bun"
                bun_bin="$BUN_INSTALL/bin/bun"
              fi
              rm -f "$tgz"
            fi
          fi
          if [ -z "$bun_bin" ]; then
            echo "::error::no bun available on this runner"
            exit 1
          fi
          case ":$PATH:" in
            *":$(dirname "$bun_bin"):"*) ;;
            *) printf '%s\n' "$(dirname "$bun_bin")" >> "$GITHUB_PATH" ;;
          esac
          "$bun_bin" --version

      - name: bun install --frozen-lockfile
        working-directory: archgate-src
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: bun install --frozen-lockfile

      - name: CPU benchmark
        working-directory: archgate-src
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -uo pipefail
          bun -e 'const t=Date.now(); let s=0; for(let i=0;i<5e7;i++){s=(s+i)%1000000007;} console.log("bench_iterations=5e7 bench_ms="+(Date.now()-t)+" checksum="+s);'

      - name: archgate latency-budget tests on linux/x64 (the control)
        working-directory: archgate-src
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set +e
          set -o pipefail
          bun test --timeout 60000 \
            tests/integration/cli-perf.test.ts \
            tests/engine/runner-pressure.test.ts \
            2>&1 | tee "$GITHUB_WORKSPACE/test-latency-budgets-x64.txt"
          rc=${PIPESTATUS[0]}
          set -e
          printf 'x64 control latency-budget suite exit code = %s\n' "$rc"
          echo "----- summary -----"
          grep -E "^[[:space:]]*[0-9]+ (pass|fail|skip|todo)|^Ran [0-9]+ tests" "$GITHUB_WORKSPACE/test-latency-budgets-x64.txt" || true
          echo "----- measured budgets -----"
          grep -E "took [0-9]+ms \(median" "$GITHUB_WORKSPACE/test-latency-budgets-x64.txt" || true
          echo "----- failing assertions -----"
          grep -E "\(fail\)" "$GITHUB_WORKSPACE/test-latency-budgets-x64.txt" || true
          echo "----- end -----"
          exit 0
