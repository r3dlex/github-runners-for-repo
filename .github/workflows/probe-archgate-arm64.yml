# THROWAWAY PROBE — delete this file and its branch once the artifact has
# been collected.
#
# Upstream archgate/cli publishes NO linux-arm64 release asset (only
# darwin-arm64, darwin-x64, linux-x64, win32-x64), so the org's linux/arm64
# runners build the native binary from source (see the `ensure_archgate`
# function in github_runners_for_repo/scripts/provision-host.sh).
#
# This probe builds the PINNED upstream release commit on a real linux/arm64
# runner, runs archgate's OWN test suite there, packages the binary with the
# upstream release asset naming (archgate-linux-arm64.tar.gz holding a single
# `archgate` binary) and publishes the sha256 so it can be registered.
#
# It publishes NOTHING to any release. Producing the bytes is this job's
# only job; registering them is a human decision.
name: probe-archgate-arm64

on:
  push:
    branches: [probe/archgate-arm64-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-archgate-arm64
  cancel-in-progress: false

jobs:
  build:
    name: "build archgate linux/arm64"
    # r3dlex-linux-arm64-1..4 — the linux/arm64 fleet. The label set is
    # pure AND, so the extra `r3dlex-linux-arm64` label keeps the macOS
    # runners and the dpua runners out of the pool.
    runs-on: [self-hosted, Linux, ARM64, r3dlex-linux-arm64]
    timeout-minutes: 45
    env:
      # The upstream v0.61.0 tag resolves to exactly this commit
      # ("chore(release): 0.61.0 (#655)").
      ARCHGATE_REF: f65d99f56d02757cca94d53f6d717333770e0170
      ASSET_NAME: archgate-linux-arm64
    steps:
      - name: Checkout archgate/cli at the pinned release commit
        uses: actions/checkout@v4
        with:
          repository: archgate/cli
          ref: f65d99f56d02757cca94d53f6d717333770e0170
          fetch-depth: 1
          persist-credentials: false

      - name: Record the checked out commit
        run: |
          set -euo pipefail
          echo "archgate HEAD = $(git rev-parse HEAD)"
          echo "archgate describe = $(git describe --tags --always 2>/dev/null || echo unknown)"
          echo "uname = $(uname -s) $(uname -m)"
          if [ "$(git rev-parse HEAD)" != "$ARCHGATE_REF" ]; then
            echo "::error::checked out commit does not match the pinned ref"
            exit 1
          fi

      - name: Install bun (job scoped)
        # The fleet shares one $HOME between runner instances, so bun is
        # installed into a job scoped directory inside the workspace
        # instead of the shared $HOME/.bun. Nothing outside this job's
        # workspace is touched.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -uo pipefail
          installer="$GITHUB_WORKSPACE/.bun-install.sh"
          mkdir -p "$BUN_INSTALL"
          if curl -fsSL --retry 3 --max-time 240 https://bun.sh/install -o "$installer"; then
            bash "$installer"
            echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
            bun_bin="$BUN_INSTALL/bin/bun"
          elif [ -x "$HOME/.bun/bin/bun" ]; then
            echo "::warning::job scoped bun install failed, falling back to the preinstalled bun"
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            bun_bin="$HOME/.bun/bin/bun"
          else
            echo "::error::no bun available on this runner"
            exit 1
          fi
          rm -f "$installer"
          "$bun_bin" --version

      - name: bun install --frozen-lockfile
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: bun install --frozen-lockfile

      - name: Run archgate's own test suite on arm64
        # package.json: "test": "bun test --timeout 60000 --parallel"
        # This step must actually run and pass. A failure here is a real
        # arm64 finding, not something to work around.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -o pipefail
          bun run test 2>&1 | tee "$GITHUB_WORKSPACE/test-output.txt"

      - name: Summarise the test result
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -uo pipefail
          echo "----- archgate test summary (arm64) -----"
          grep -E "^[[:space:]]*[0-9]+ (pass|fail|skip|todo)|^Ran [0-9]+ tests" "$GITHUB_WORKSPACE/test-output.txt" || true
          echo "----- end summary -----"

      - name: Build the linux/arm64 binary
        # The compile flags mirror the `ensure_archgate` recipe in
        # github_runners_for_repo/scripts/provision-host.sh — the recipe the
        # org's own arm64 CI already runs `archgate check` with. The
        # --compile-exec-argv flag matches upstream's release-binaries.yml
        # so this asset trusts the same CA store as the darwin-arm64 and
        # linux-x64 assets superman's CI already consumes. --target is
        # omitted because the host IS bun-linux-arm64, so the default target
        # is already correct.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -euo pipefail
          mkdir -p out
          bun build src/cli.ts --compile --bytecode \
            --compile-exec-argv=--use-system-ca \
            --outfile out/archgate
          chmod +x out/archgate
          ls -l out/archgate
          file out/archgate || true

      - name: Prove the binary runs on arm64
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -euo pipefail
          echo "----- archgate --version -----"
          out/archgate --version
          echo "----- archgate --help (head) -----"
          out/archgate --help 2>&1 | head -30
          version="$(out/archgate --version 2>&1 | tr -d '[:space:]')"
          echo "parsed version = $version"
          case "$version" in
            *0.61.0*) echo "version 0.61.0 confirmed" ;;
            *) echo "::error::expected version 0.61.0, got '$version'"; exit 1 ;;
          esac

      - name: Functional smoke test (archgate check on its own repo)
        # A vacuous pass is possible (archgate skips ADRs whose scope misses
        # the changed file set), so this is reported, not enforced. It still
        # proves the compiled engine loads and runs on arm64.
        env:
          BUN_INSTALL: ${{ github.workspace }}/.bun-install
        run: |
          set -uo pipefail
          out/archgate check 2>&1 | tee "$GITHUB_WORKSPACE/check-output.txt" | tail -40
          echo "archgate check exit code = ${PIPESTATUS[0]:-$?}"
          exit 0

      - name: Package the release asset and compute the checksums
        # Upstream shape: a tarball holding a single `archgate` binary at the
        # archive root, plus a <asset>.sha256 file in `sha256sum` format.
        run: |
          set -euo pipefail
          cd out
          tar -czf "$ASSET_NAME.tar.gz" archgate
          sha256sum "$ASSET_NAME.tar.gz" > "$ASSET_NAME.tar.gz.sha256"
          sha256sum archgate > archgate.binary.sha256
          echo "----- sha256sum of the tarball -----"
          cat "$ASSET_NAME.tar.gz.sha256"
          echo "----- sha256sum of the bare binary -----"
          cat archgate.binary.sha256
          echo "----- tarball contents -----"
          tar -tzf "$ASSET_NAME.tar.gz"
          echo "----- sizes -----"
          ls -l "$ASSET_NAME.tar.gz" archgate

      - name: Publish the summary
        run: |
          set -euo pipefail
          tarball_sha="$(awk '{print $1}' "out/$ASSET_NAME.tar.gz.sha256")"
          binary_sha="$(awk '{print $1}' out/archgate.binary.sha256)"
          {
            echo "## archgate linux/arm64 build"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| archgate commit | \`$ARCHGATE_REF\` |"
            echo "| archgate version | \`0.61.0\` |"
            echo "| runner | \`${{ github.run_id }}\` / \`${{ github.job }}\` |"
            echo "| runner name | \`${{ runner.name }}\` |"
            echo "| runner arch | \`${{ runner.os }}\` / \`${{ runner.arch }}\` |"
            echo "| tarball | \`$ASSET_NAME.tar.gz\` |"
            echo "| tarball sha256 | \`$tarball_sha\` |"
            echo "| binary sha256 | \`$binary_sha\` |"
            echo ""
            echo "### archgate test suite on arm64"
            echo ""
            echo '```'
            grep -E "^[[:space:]]*[0-9]+ (pass|fail|skip|todo)|^Ran [0-9]+ tests" test-output.txt || echo "(no summary line captured)"
            echo '```'
            echo ""
            echo "### archgate --version"
            echo ""
            echo '```'
            out/archgate --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: archgate-linux-arm64-0.61.0
          # `out/` is not a dot directory, so no include-hidden-files needed.
          path: |
            out/archgate-linux-arm64.tar.gz
            out/archgate-linux-arm64.tar.gz.sha256
            out/archgate.binary.sha256
          if-no-files-found: error
          retention-days: 30
